---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: inside-net
spec:
  config: |
    {
      "cniVersion": "0.4.0",
      "type": "macvlan",
      "master": "eth1",
      "mode": "bridge",
      "ipam": {
        "type": "whereabouts",
        "range": "10.10.1.0/24",
        "gateway": "10.10.1.1"
      }
    }
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: outside-net
spec:
  config: |
    {
      "cniVersion": "0.4.0",
      "type": "macvlan",
      "master": "eth2",
      "mode": "bridge",
      "ipam": {
        "type": "whereabouts",
        "range": "10.10.2.0/24",
        "gateway": "10.10.2.1"
      }
    }
---
apiVersion: v1
kind: Pod
metadata:
  name: app-pod
  annotations:
    k8s.v1.cni.cncf.io/networks: |
      [
        {
          "name": "inside-net",
          "interface": "net1",
          "ips": ["10.10.1.2/24"]
        }
      ]
spec:
  containers:
    - name: app
      image: nicolaka/netshoot
      command: ["sleep", "infinity"]
---
apiVersion: v1
kind: Pod
metadata:
  name: cnf-pod
  annotations:
    k8s.v1.cni.cncf.io/networks: |
      [
        {
          "name": "inside-net",
          "interface": "net1",
          "ips": ["10.10.1.1/24"]
        },
        {
          "name": "outside-net",
          "interface": "net2",
          "ips": ["10.10.2.1/24"]
        }
      ]
spec:
  containers:
    - name: cnf
      image: nicolaka/netshoot
      securityContext:
        privileged: true
      command:
        - sh
        - -c
        - |
          sysctl -w net.ipv4.ip_forward=1
          sleep infinity
---
apiVersion: v1
kind: Pod
metadata:
  name: wan-pod
  annotations:
    k8s.v1.cni.cncf.io/networks: |
      [
        {
          "name": "outside-net",
          "interface": "net1",
          "ips": ["10.10.2.2/24"]
        }
      ]
spec:
  containers:
    - name: wan
      image: nicolaka/netshoot
      command: ["sleep", "infinity"]
